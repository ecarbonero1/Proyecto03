<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrate</title>
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Poppins:wght@600;700;800&display=swap"
        rel="stylesheet">
</head>

<body>
    <header>
        <a href="./index.html"><img class="logo" src="./img/logoben.png" alt="logo"></a>
        <nav class="navprincipal">
            <ul class="ulprincipal">
                <li><a href="./index.html">Home</a></li>
                <li><a href="./login.html">Login</a></li>
                <li><a href="./register.html">Registro</a></li>
            </ul>
        </nav>
    </header>
    <section class="registro">
        <h1 class="h1inicio">Registrate</h1>
        <form action="./index.html" method="get" class="formRegistro">
            <div class="grupo">

                <br>
                <label for="Email">Email:</label>
                <input type="email" name="Email" id="Email" value="">
                <p class="errorEmail"></p>

                <br>
                <label for="Contraseña">Contraseña:</label>
                <input type="password" name="Contraseña" id="Contraseña" value="">
                <p class="errorPassword"></p>

                <br>
                <label for="repetirContraseña">Repetir contraseña:</label>
                <input type="samepassword" name="repetirContraseña" id="repetirContraseña" value="">
                <p class="errorRepeat"></p>

            </div>

            <div>
                <br>
                <input type="checkbox" name="TyC" id="TyC" value="">
                <label for="TyC">Acepto terminos y condiciones</label>
            </div>

            <div class="boton">
                <button type="submit">Registrarme</button>
            </div>

            <div class="boton">
                <button type="submit"><a href="./login.html">Ya tengo una cuenta</a></button>
            </div>
        </form>
    </section>

    <script src="./js/register.js"></script>
</body>

</html>
